<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Relógio experimental em p5.js baseado na variação de peso da tipografia SN Pro."
    />
    <title>Weight Clock — SN Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside
      class="color-device color-device--hidden"
      aria-labelledby="color-device-title"
      aria-hidden="true"
    >
      <span id="color-device-title" class="color-device__title">Cores</span>

      <label class="color-control">
        <span>Background</span>
        <input
          id="background-color"
          type="color"
          value="#ffffff"
          data-ring-color="background"
          aria-label="Cor do background da página"
        />
      </label>

      <label class="color-control">
        <span>Horas</span>
        <input
          id="hours-color"
          type="color"
          value="#f4ffee"
          data-ring-color="hoursBackground"
          aria-label="Cor do anel das horas"
        />
      </label>

      <label class="color-control">
        <span>Minutos</span>
        <input
          id="minutes-color"
          type="color"
          value="#e7fddb"
          data-ring-color="minutesBackground"
          aria-label="Cor do anel dos minutos"
        />
      </label>

      <label class="color-control">
        <span>Segundos</span>
        <input
          id="seconds-color"
          type="color"
          value="#f5f5f5"
          data-ring-color="secondsBackground"
          aria-label="Cor do anel dos segundos"
        />
      </label>

      <label class="color-control">
        <span>Números</span>
        <input
          id="numbers-color"
          type="color"
          value="#000000"
          data-ring-color="numbers"
          aria-label="Cor dos números"
        />
      </label>

      <label class="color-control">
        <span>Centro</span>
        <input
          id="center-color"
          type="color"
          value="#ff9cde"
          data-ring-color="centerMarker"
          aria-label="Cor do círculo central"
        />
      </label>

      <button
        id="color-reset"
        class="color-device__reset"
        type="button"
        aria-label="Restaurar as cores originais"
      >
        Reset
      </button>
    </aside>

    <main class="clock-stage">
      <div
        id="clock-canvas"
        role="img"
        aria-label="Relógio tipográfico com horas, minutos e segundos distribuídos em três círculos."
      ></div>
      <p id="clock-readout" class="visually-hidden" aria-live="polite"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
